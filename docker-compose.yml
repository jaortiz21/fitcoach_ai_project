version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
      # NOTE: init-models.sh lives in ./models now (it moved out of ./scripts/
      # in a previous commit); this mount was left pointing at the old path
      # and would fail to start the stack.
      - ./models/init-models.sh:/init-models.sh
    entrypoint: ["/bin/bash", "/init-models.sh"]
    environment:
      - OLLAMA_HOST=0.0.0.0

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: ./api
    container_name: fitcoach-api
    restart: unless-stopped
    depends_on:
      - ollama
      - qdrant
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_HOST=http://qdrant:6333
      - OLLAMA_MODEL=fitcoach:latest
    volumes:
      - ./data:/app/data

volumes:
  ollama_data:
  qdrant_data:

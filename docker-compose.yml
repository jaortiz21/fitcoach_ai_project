version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
      # NOTE: init-models.sh lives in ./models now (it moved out of ./scripts/
      # in a previous commit); this mount was left pointing at the old path
      # and would fail to start the stack.
      - ./models/init-models.sh:/init-models.sh
    entrypoint: ["/bin/bash", "/init-models.sh"]
    environment:
      - OLLAMA_HOST=0.0.0.0

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: ./api
    container_name: fitcoach-api
    restart: unless-stopped
    depends_on:
      - ollama
      - qdrant
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_HOST=http://qdrant:6333
      - OLLAMA_MODEL=fitcoach:latest
      # Frontend's origin. Tighten/extend this (comma-separated) before
      # exposing the API beyond your own machine/network.
      - CORS_ORIGINS=http://localhost:8080
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    container_name: fitcoach-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    # No API base is injected here: it's a plain static nginx image with no
    # templating, so index.html's JS just derives the API URL from
    # window.location.hostname at runtime (defaults to <same host>:8000,
    # which is correct for this compose file). Use the "change" link in the
    # UI, or edit frontend/index.html's defaultApiBase(), if you deploy the
    # frontend and API on different hosts.

volumes:
  ollama_data:
  qdrant_data:
